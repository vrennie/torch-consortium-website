name: Deploy TORCH to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check archived assets
        run: |
          test -d public/assets/media
          echo "Archived images: $(find public/assets/media -type f ! -name '.gitkeep' | wc -l)"
      - name: Set up Python for PDF generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate four-page pamphlet PDF
        run: |
          python -m pip install --disable-pip-version-check pillow pypdf
          python scripts/make_parrtb_pdf.py
      - name: Build website
        run: npm run build
      - name: Check generated website
        run: |
          test -s dist/index.html
          test -s dist/assets/site.css
          test -s dist/assets/documents/PARR-TB-Medical-Officers-Pamphlet.pdf
          test -s dist/branding/torch-horizontal.svg
          test -s dist/branding/torch-square.svg
          test -s dist/funding/index.html
          test -s dist/funding-1/index.html
          grep -q 'class="funding-grid"' dist/funding/index.html
          test -s dist/assets/media/find-logo.svg
          grep -q 'https://www.finddx.org/' dist/funding/index.html
          grep -q 'logo-fwo.svg' dist/funding/index.html
          grep -q 'CRITICAL_PATH_INSTITUTE__Logo.jpg' dist/funding/index.html
          grep -q 'GetLogoFileById' dist/funding/index.html
          grep -q 'https://c-path.org/donate/' dist/funding/index.html
          grep -q 'https://www.kaust.edu.sa/en/' dist/funding/index.html
          grep -q 'https://www.cdc.gov/index.html' dist/funding/index.html
          if grep -q 'ReSeqTB' dist/funding/index.html; then echo "ReSeqTB still present"; exit 1; fi
          test "$(grep -o 'class="funding-card"' dist/funding/index.html | wc -l)" -eq 9
          test "$(grep -o 'class="funding-card" href=' dist/funding/index.html | wc -l)" -eq 9
          test "$(grep -o 'class="funding-card"' dist/funding/index.html | wc -l)" -eq 9
          grep -q 'funding/' dist/funding-1/index.html
          test -s dist/branding/mick-magma-logo.jpg
          # Verify the intended Vision & Mission page structure, not just build success.
          test "$(grep -o 'class="vision-mission-icon"' dist/focus-area/index.html | wc -l)" -eq 3
          test "$(grep -o 'class="vision-mission-card"' dist/focus-area/index.html | wc -l)" -eq 3
          test "$(grep -o 'class="vision-priority"' dist/focus-area/index.html | wc -l)" -eq 5
          ! grep -q 'vision-mission-number' dist/focus-area/index.html
          grep -q 'vision-mission-icon-wrap' dist/assets/site.css
          grep -q 'Additional peer-reviewed articles' dist/publications/index.html
          grep -q '10.5588/ijtld.20.0886' dist/publications/index.html
          grep -q '10.1016/j.meegid.2019.103948' dist/publications/index.html
          grep -q 'content="0;url=/torch-consortium-website/publications/"' dist/output/index.html
          grep -q 'grid-template-columns:46px minmax(0,1fr)' dist/assets/site.css
          grep -q 'class="vision-priority-number"' dist/focus-area/index.html
          grep -q 'Frequently asked questions' dist/parrtb/index.html
          grep -q 'class="parrtb-link-grid"' dist/parrtb/index.html
          if grep -q 'class="cover"' dist/parrtb/index.html; then
            echo "Unexpected image cards on PARR-TB resource page"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Allow artifact metadata to become available
        run: sleep 20
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

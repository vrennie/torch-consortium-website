name: Deploy TORCH to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check archived assets
        run: |
          test -d public/assets/media
          echo "Archived images: $(find public/assets/media -type f ! -name '.gitkeep' | wc -l)"
      - name: Build website
        run: npm run build
      - name: Check generated website
        run: |
          test -s dist/index.html
          test -s dist/assets/site.css
          test -s dist/branding/torch-horizontal.svg
          test -s dist/branding/torch-square.svg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Allow artifact metadata to become available
        run: sleep 20
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy TORCH to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check archived assets
        run: |
          test -d public/assets/media
          echo "Archived images: $(find public/assets/media -type f ! -name '.gitkeep' | wc -l)"
      - name: Set up Python for PDF generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate four-page pamphlet PDF
        run: |
          python -m pip install --disable-pip-version-check pillow pypdf
          python scripts/make_parrtb_pdf.py
      - name: Build website
        run: npm run build
      - name: Check generated website
        run: |
          test -s dist/index.html
          test -s dist/news/index.html
          grep -q 'meta http-equiv="refresh"' dist/news/index.html
          grep -q 'TORCH Consortium homepage' dist/news/index.html
          if grep -q '>News</a>' dist/index.html; then echo "News still appears in navigation"; exit 1; fi
          test -s dist/assets/site.css
          test -s dist/publications/index.html
          grep -q 'id="featured-papers-title"' dist/publications/index.html
          grep -q 'id="all-publications"' dist/publications/index.html
          test "$(grep -o 'pub-feature-card-top' dist/publications/index.html | wc -l)" -ge 12
          test "$(grep -o 'class="pub-feature-author-badge"' dist/publications/index.html | wc -l)" -eq 8
          grep -q 'Eight papers with Prof. Annelies Van Rie as last author' dist/publications/index.html
          grep -q '10.1016/S2666-5247(21)00301-3' dist/publications/index.html
          grep -q 'Selected publications' dist/publications/index.html
          test -s dist/assets/documents/PARR-TB-Medical-Officers-Pamphlet.pdf
          test -s dist/branding/torch-horizontal.svg
          test -s dist/branding/torch-square.svg
          test -s dist/funding/index.html
          # Projects sections must be separately addressable and non-overlapping.
          grep -q 'id="current-projects"' dist/projects/index.html
          grep -q 'id="past-projects"' dist/projects/index.html
          grep -Fq 'body:has(#past-projects:target) #current-projects{display:none}' dist/assets/site.css
          grep -Fq 'body:has(#current-projects:target) #past-projects{display:none}' dist/assets/site.css
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const html=readFileSync("dist/projects/index.html","utf8"); const current=html.split(/<section class="project-group" id="current-projects"/)[1]?.split(/<\/section>/)[0]||""; const past=html.split(/<section class="project-group" id="past-projects"/)[1]?.split(/<\/section>/)[0]||""; if(!current||!past) process.exit(1); const ids=["genpath-africa-parrtb","disrupt-rr-tb","new-page-2"]; if(ids.some(id=>past.includes("/"+id+"/"))) { console.error("Current project found in Past Projects"); process.exit(1); }'
          test -s dist/funding-1/index.html
          grep -q 'class="funding-grid"' dist/funding/index.html
          test -s dist/assets/media/find-logo.svg
          test -s dist/assets/media/find-logo-highres.svg
          grep -q 'assets/media/find-logo-highres.svg' dist/funding/index.html
          grep -q 'https://www.global-health-edctp3.europa.eu/index_en' dist/funding/index.html
          grep -q 'European Research Council (ERC) Advanced Grant' dist/funding/index.html
          grep -q 'Prof. Annelies Van Rie' dist/funding/index.html
          grep -q 'DiSrupT RR-TB' dist/funding/index.html
          grep -q 'LOGO_ERC-FLAG_EU.png' dist/funding/index.html
          if grep -q 'www.globalhealth-edctp3.eu' dist/funding/index.html; then echo "Old EDCTP URL still in page"; exit 1; fi
          test -s dist/assets/media/fwo-logo.svg
          test -s dist/assets/media/cdc-logo.svg
          test -s dist/assets/media/tgen-logo.webp
          grep -q 'assets/media/fwo-logo.svg' dist/funding/index.html
          grep -q 'assets/media/cdc-logo.svg' dist/funding/index.html
          grep -q 'assets/media/tgen-logo.webp' dist/funding/index.html
          grep -q 'SMARTT clinical trial' dist/funding/index.html
          if grep -q 'assets/media/tgen-logo.svg' dist/funding/index.html; then echo "Old logo still referenced"; exit 1; fi
          if grep -Eq 'GetLogoFileById|CDC_logo_2024.svg.png|logo-fwo.svg' dist/funding/index.html; then echo "Remote logo link not removed"; exit 1; fi
          grep -q 'https://www.finddx.org/' dist/funding/index.html

          grep -q 'CRITICAL_PATH_INSTITUTE__Logo.jpg' dist/funding/index.html

          grep -q 'https://c-path.org/donate/' dist/funding/index.html
          grep -q 'https://www.kaust.edu.sa/en/' dist/funding/index.html
          grep -q 'https://www.cdc.gov/index.html' dist/funding/index.html
          if grep -q 'ReSeqTB' dist/funding/index.html; then echo "ReSeqTB still present"; exit 1; fi
          test "$(grep -o 'class="funding-card"' dist/funding/index.html | wc -l)" -eq 10
          test "$(grep -o 'class="funding-card" href=' dist/funding/index.html | wc -l)" -eq 10

          grep -q 'funding/' dist/funding-1/index.html
          test -s dist/branding/mick-magma-logo.jpg
          # Verify the intended Vision & Mission page structure, not just build success.
          test "$(grep -o 'class="vision-mission-icon"' dist/focus-area/index.html | wc -l)" -eq 3
          test "$(grep -o 'class="vision-mission-card"' dist/focus-area/index.html | wc -l)" -eq 3
          test "$(grep -o 'class="vision-priority"' dist/focus-area/index.html | wc -l)" -eq 5
          ! grep -q 'vision-mission-number' dist/focus-area/index.html
          grep -q 'vision-mission-icon-wrap' dist/assets/site.css
          grep -q 'Additional peer-reviewed articles' dist/publications/index.html
          grep -q '10.5588/ijtld.20.0886' dist/publications/index.html
          grep -q '10.1016/j.meegid.2019.103948' dist/publications/index.html
          grep -q 'content="0;url=/torch-consortium-website/publications/"' dist/output/index.html
          grep -q 'grid-template-columns:46px minmax(0,1fr)' dist/assets/site.css
          grep -q 'class="vision-priority-number"' dist/focus-area/index.html
          grep -q 'Frequently asked questions' dist/parrtb/index.html
          grep -q 'class="parrtb-link-grid"' dist/parrtb/index.html
          if grep -q 'class="cover"' dist/parrtb/index.html; then
            echo "Unexpected image cards on PARR-TB resource page"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Allow artifact metadata to become available
        run: sleep 20
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
